<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Intensity Control</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="control-panel">

        <div class="control-header">

            <h1>Intensity Control</h1>

            <span id="intensity-value">128</span>

        </div>

        <div class="slider-container">

            <div class="slider-labels">

                <span>0</span>
                <span>255</span>

            </div>

            <input
                type="range"
                id="intensity-slider"
                min="0"
                max="255"
                value="128"
                step="1"
            >

        </div>

    </main>

<script>

    const slider =
        document.getElementById("intensity-slider");

    const valueDisplay =
        document.getElementById("intensity-value");


    const socket =
        new WebSocket("ws://localhost:9000");


    socket.onopen = function () {

        console.log("Connected To Server");

    };


    slider.addEventListener("input", function () {

        const intensity = slider.value;

        valueDisplay.textContent = intensity;

        if (socket.readyState === WebSocket.OPEN) {

            socket.send(intensity);

        }

    });


    socket.onmessage = function (event) {

        const intensity = parseInt(event.data);

        slider.value = intensity;

        valueDisplay.textContent = intensity;

        console.log("Current Intensity:", intensity);

    };


    socket.onclose = function () {

        console.log("Disconnected From Server");

    };


    socket.onerror = function (error) {

        console.log("WebSocket Error:", error);

    };

</script>

</body>

</html>
